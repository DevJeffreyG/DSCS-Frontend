<div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] sm:p-6 w-3xs h-full">
  <div>
    <div
      class="mb-5 flex h-14 max-w-14 items-center justify-center rounded-[10.5px] {{bgColor}} {{textColor}}">
      <p class="text-2xl font-bold">{{ number }}{{suffix ?? ''}}</p>
    </div>

    <h2 class="text-lg font-bold text-gray-900 dark:text-white">{{ title }}</h2>

    @if (description) {
      <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
        {{ description }}
      </p>
    }
  </div>
</div>
