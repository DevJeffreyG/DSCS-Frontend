<div class="relative">

  <!-- BOTON USUARIO -->
  <button
    (click)="toggleDropdown()"
    class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400"
  >

    <!-- ICONO USUARIO -->
    <div
      class="flex items-center justify-center w-11 h-11 rounded-full bg-gray-200 dark:bg-gray-700"
    >

      <svg
        class="w-6 h-6 text-gray-500"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5.121 17.804A9 9 0 1118.88 17.8M15 11a3 3 0 11-6 0 3 3 0 016 0z"
        />
      </svg>

    </div>

    <!-- NOMBRE -->
    <span class="block mr-1 ml-3 font-medium text-theme-sm">
      {{ userName }}
    </span>

    <!-- FLECHA -->
    <svg
      [ngClass]="{
        'stroke-gray-500 dark:stroke-gray-400 transition-transform duration-200': true,
        'rotate-180': isOpen
      }"
      width="18"
      height="20"
      viewBox="0 0 18 20"
      fill="none"
    >
      <path
        d="M4.3125 8.65625L9 13.3437L13.6875 8.65625"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

  </button>

  <!-- DROPDOWN -->
  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute right-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark"
  >

    <!-- INFO -->
    <div>

      <span class="block font-semibold text-gray-800 text-theme-sm dark:text-white">
        {{ userName }}
      </span>

      <span class="mt-1 block text-theme-xs text-gray-500 dark:text-gray-400">
        {{ userEmail }}
      </span>

    </div>

    <!-- LINEA -->
    <div class="my-4 border-t border-gray-200 dark:border-gray-700"></div>

    <!-- LOGOUT -->
    <button
      (click)="logout()"
      class="flex items-center gap-3 px-3 py-3 font-medium text-gray-700 rounded-xl hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800 transition-all"
    >

      <!-- ICONO -->
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"
        />
      </svg>

      Sign out

    </button>

  </app-dropdown>

</div>
