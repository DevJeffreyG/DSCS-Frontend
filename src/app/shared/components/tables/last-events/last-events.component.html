<div>
  <!-- Bridge indicator para mostrar conexión con simulador -->

  <!-- Tabla de alertas -->
  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white dark:border-white/[0.05] dark:bg-white/[0.03]">
    <div class="max-w-full overflow-x-auto">
      <table class="min-w-full">
      <!-- Table Header -->
      <thead class="border-b border-gray-100 dark:border-white/[0.05]">
        <tr>
          <th class="px-5 py-3 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Tipo</th>
          <th class="px-5 py-3 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Recurso</th>
          <th class="px-5 py-3 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Mensaje</th>
          <th class="px-5 py-3 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Tiempo</th>
          <th class="px-5 py-3 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Estado</th>
        </tr>
      </thead>
      <!-- Table Body -->
      <tbody class="divide-y divide-gray-100 dark:divide-white/[0.05]">
        @if (alerts.length === 0) {
          <tr>
            <td colspan="5" class="px-5 py-8 text-center text-gray-500 dark:text-gray-400">
              <span class="text-theme-sm">No hay alertas en este servidor</span>
            </td>
          </tr>
        } @else {
          @for (alert of alerts; track alert.id) {
            <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.05] transition">
              <!-- Tipo de Alerta -->
              <td class="px-5 py-4 sm:px-6 text-start">
                <app-badge [color]="getBadgeColor(alert.tipo)">
                  {{ alert.tipo }}
                </app-badge>
              </td>
              
              <!-- Recurso -->
              <td class="px-4 py-3 text-start text-theme-sm">
                <div class="flex items-center gap-2">
                  <div 
                    class="w-2 h-2 rounded-full" 
                    [style.background-color]="getRecursoColor(alert.recurso)"
                  ></div>
                  <span class="font-medium text-gray-800 dark:text-white/90">
                    {{ alert.recurso }}
                  </span>
                </div>
              </td>
              
              <!-- Mensaje -->
              <td class="px-4 py-3 text-gray-600 text-start text-theme-sm dark:text-gray-400">
                {{ alert.mensaje }}
              </td>
              
              <!-- Timestamp -->
              <td class="px-4 py-3 text-gray-500 text-start text-theme-sm dark:text-gray-400">
                {{ formatTimestamp(alert.timestamp) }}
              </td>
              
              <!-- Estado -->
              <td class="px-4 py-3 text-start">
                @if (alert.resuelto) {
                  <app-badge color="success" size="sm">
                    Resuelto
                  </app-badge>
                } @else {
                  <app-badge color="error" size="sm">
                    Activo
                  </app-badge>
                }
              </td>
            </tr>
          }
        }
      </tbody>
      </table>
    </div>
  </div>
</div>
