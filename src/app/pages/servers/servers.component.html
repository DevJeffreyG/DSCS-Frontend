<div class="p-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between mb-6">

    <div>
      <h1 class="text-3xl font-bold text-gray-800">
        Panel de Servidores
      </h1>

      <p class="text-gray-500">
        Monitoreo en tiempo real de computadores y servidores
      </p>
    </div>

    <!-- BOTON -->
    <button
      class="bg-blue-600 text-white px-5 py-3 rounded-xl hover:bg-blue-700 transition"
      (click)="showForm = !showForm"
    >
      + Agregar Servidor
    </button>

  </div>

  <!-- FORMULARIO -->
  @if (showForm) {

    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200 mb-6">

      <h2 class="text-xl font-bold mb-4">
        Nuevo Servidor
      </h2>

      <!-- NOMBRE -->
      <input
        type="text"
        placeholder="Nombre del servidor"
        [(ngModel)]="newServer.nombre"
        class="w-full border p-3 rounded-xl mb-4"
      />

      <!-- IP -->
      <input
        type="text"
        placeholder="IP del servidor"
        [(ngModel)]="newServer.ip"
        class="w-full border p-3 rounded-xl mb-4"
      />

      <!-- ESTADO -->
      <select
        [(ngModel)]="newServer.estado"
        class="w-full border p-3 rounded-xl mb-4"
      >
        <option value="Online">Online</option>
        <option value="Offline">Offline</option>
      </select>

      <!-- GUARDAR -->
      <button
        class="bg-green-600 text-white px-5 py-3 rounded-xl hover:bg-green-700"
        (click)="addServer()"
      >
        Guardar Servidor
      </button>

    </div>

  }

  <!-- GRID -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

    @for (server of servers; track server.id) {

      <div class="bg-white rounded-2xl shadow-md p-6 border border-gray-200">

        <!-- HEADER -->
        <div class="flex items-center justify-between mb-4">

          <div>

            <h2 class="text-xl font-semibold text-gray-800">
              {{ server.nombre }}
            </h2>

            <p class="text-sm text-gray-500">
              {{ server.ip }}
            </p>

          </div>

          <div
            class="px-3 py-1 rounded-full text-sm font-medium"
            [class.bg-green-100]="server.estado === 'Online'"
            [class.text-green-700]="server.estado === 'Online'"
            [class.bg-red-100]="server.estado === 'Offline'"
            [class.text-red-700]="server.estado === 'Offline'"
          >
            {{ server.estado }}
          </div>

        </div>

        <!-- CPU -->
        <div class="mb-4">

          <div class="flex justify-between mb-1">
            <span>CPU</span>
            <span>{{ server.cpu }}%</span>
          </div>

          <div class="w-full bg-gray-200 rounded-full h-3">
            <div
              class="bg-blue-600 h-3 rounded-full"
              [style.width.%]="server.cpu"
            ></div>
          </div>

        </div>

        <!-- RAM -->
        <div class="mb-4">

          <div class="flex justify-between mb-1">
            <span>RAM</span>
            <span>{{ server.ram }}%</span>
          </div>

          <div class="w-full bg-gray-200 rounded-full h-3">
            <div
              class="bg-green-600 h-3 rounded-full"
              [style.width.%]="server.ram"
            ></div>
          </div>

        </div>

        <!-- DISCO -->
        <div class="mb-6">

          <div class="flex justify-between mb-1">
            <span>Disco</span>
            <span>{{ server.disco }}%</span>
          </div>

          <div class="w-full bg-gray-200 rounded-full h-3">
            <div
              class="bg-orange-500 h-3 rounded-full"
              [style.width.%]="server.disco"
            ></div>
          </div>

        </div>

        <!-- BOTON -->
        <button
          class="w-full bg-gray-900 text-white py-3 rounded-xl hover:bg-black transition"
          (click)="monitorFullView(server)"
        >
          Ver Monitor
        </button>

      </div>

    }

  </div>

</div>
