<div class="p-6">

  <div class="flex items-center justify-between mb-6">
    <div>
        <h1 class="text-3xl font-bold text-gray-800">
        Monitoreo 
        </h1>

        <p class="text-gray-500">
        Monitoreo en tiempo real del servidor: {{server?.nombre }}
        </p>
    </div>
    </div>

    <div class="grid grid-cols-12 gap-4 md:gap-6">
        <div class="col-span-12 flex flex-row gap-4 overflow-x-auto w-full min-w-0">
            <app-usage-chart class="flex-1 min-w-[200px]" [server-id]="server?.id ?? 0" [usage-type]="MonitorType.CPU" />
            <app-usage-chart class="flex-1 min-w-[200px]" [server-id]="server?.id ?? 0" [usage-type]="MonitorType.RAM" />
            <app-usage-chart class="flex-1 min-w-[200px]" [server-id]="server?.id ?? 0" [usage-type]="MonitorType.DISK" />
            <app-usage-chart class="flex-1 min-w-[200px]" [server-id]="server?.id ?? 0" [usage-type]="MonitorType.NET" />
        </div>

        <div class="col-span-12">
            <app-last-events [serverId]="server?.id ?? 0" />
        </div>
    </div>
</div>
